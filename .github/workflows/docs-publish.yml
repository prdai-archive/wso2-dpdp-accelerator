# Builds the Docusaurus docs site and deploys it to GitHub Pages on every push
# to main (plus manual dispatch). The site is served from the project Pages
# sub-path https://wso2.github.io/dpdp-accelerator/, hence
# BASE_URL=/dpdp-accelerator/.
name: Docs publish

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          # Full history so showLastUpdateTime can read per-file git dates.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build Docusaurus site
        run: npm run build
        working-directory: docs
        env:
          BASE_URL: /dpdp-accelerator/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
