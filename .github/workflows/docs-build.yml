# Builds the Docusaurus docs site on every PR to make sure the documentation
# compiles. Broken links/markdown links are configured as warnings
# (onBrokenLinks/onBrokenMarkdownLinks: 'warn') so they surface here without
# blocking the build.
name: Docs build

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build Docusaurus site
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        working-directory: docs
        env:
          BASE_URL: /wso2-dpdp-accelerator/

      - name: Report broken-link warnings
        if: always()
        continue-on-error: true
        run: |
          cd docs
          {
            echo "## Broken links";
            echo "";
            if [ ! -f build.log ]; then
              echo "_Build log not found - skipping._";
            else
              matches=$(grep -niE "broken (link|markdown link|anchor)|docusaurus found broken" build.log || true)
              if [ -z "$matches" ]; then
                echo "No broken-link warnings reported by the build.";
              else
                echo "The build reported the following warnings:";
                echo "";
                echo '```';
                echo "$matches";
                echo '```';
              fi
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
